<script>var SFX = {}; function toast() {} var tval = v => typeof v === "function" ? v() : tx(v); var esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);</script>

<script>
// fitxes «graella»: la línia del nom fa servir l'etiqueta de l'imprimible (label: "ca|es"); si no en té, «Nom del repte» al curs
// Robot (reptes d'en Bit) i «Títol» als altres cursos (Tech IA…), on la fitxa no és un repte
(function () {
  var doc = document.getElementById('doc'); if (!doc || typeof MutationObserver !== 'function') return;
  var mo = new MutationObserver(function () {
    var sid = new URLSearchParams(location.search).get('s'), G = typeof TGUIDE !== 'undefined' && TGUIDE[sid], ps = doc.querySelectorAll('.page'); if (!G || !ps.length) return; mo.disconnect();
    var C = (TECH || []).find(function (c) { return c.units.some(function (u) { return (u.s || []).some(function (s) { return s.id === sid; }); }); }), robot = !C || C.id === 'robot';
    var gs = (G.print || []).filter(function (p) { return p.k === 'graella'; }), pages = [].filter.call(ps, function (pg) { return pg.querySelector('.pgrid'); });
    pages.forEach(function (pg, i) { var pr = gs[i], n = pg.querySelector('p.name'); if (!pr || !n || (!pr.label && robot)) return;
      n.innerHTML = L('Nom', 'Nombre') + ': ______________________________ &nbsp; ' + esc(pr.label ? tx(pr.label) : L('Títol', 'Título')) + ': ______________________'; });
  });
  mo.observe(doc, { childList: true });
})();
</script>
