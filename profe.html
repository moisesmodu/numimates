<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración · Numi Mates</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
img.ic{display:inline-block;width:1.2em;height:1.2em;object-fit:contain;vertical-align:-.22em;margin:0 .02em;pointer-events:none}
:root{--bg:#FBF8FF;--ink:#2B1A38;--mut:#8A7B99;--line:#ECE4F3;--pri:#602B7A;--ok:#2A9C50;--fire:#E8590C;--ko:#D63C42}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 60px}
h1{color:var(--pri);font-weight:900;margin:0 0 4px}.lead{color:var(--mut);margin:0 0 20px}
.login{max-width:360px;margin:12vh auto;background:#fff;border:2px solid var(--line);border-radius:22px;padding:26px;text-align:center}
input,select{font:inherit;border:2px solid #D7C6E6;border-radius:12px;padding:11px 14px;width:100%;color:var(--ink);background:#fff}
button{font:inherit;font-weight:900;border:0;border-radius:12px;padding:11px 16px;background:var(--pri);color:#fff;cursor:pointer;box-shadow:0 4px 0 #46195C}
button.ghost{background:#fff;color:var(--pri);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
button.mini{padding:5px 9px;font-size:12px;border-radius:9px;box-shadow:0 2px 0 var(--line)}
button.mini.red{color:var(--ko)}
.err{color:var(--ko);min-height:20px;margin:8px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px}.kpi b{display:block;font-size:26px}.kpi span{color:var(--mut);font-size:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar select,.bar input{width:auto}
.tw{overflow-x:auto;background:#fff;border:2px solid var(--line);border-radius:18px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;background:#FAF6FD;position:sticky;top:0;cursor:pointer}
tr:last-child td{border-bottom:0}.code{font-family:ui-monospace,monospace;color:var(--pri);font-size:13px}
.fire{color:var(--fire);font-weight:900}.mut{color:var(--mut)}.rw{letter-spacing:2px}
.pill{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;background:#F1E8FA;color:var(--pri)}
.up{color:var(--ok)}.down{color:var(--ko)}
.cold{opacity:.55}
.note{color:var(--mut);font-size:13.5px;line-height:1.5;margin-top:16px}
.ov{position:fixed;inset:0;background:rgba(43,26,56,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.ovc{background:#fff;border-radius:20px;padding:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto}.rrow{display:grid;grid-template-columns:1fr 160px 110px;gap:10px;align-items:center;margin:8px 0;font-size:14px}.rbar{height:12px;background:#EEE;border-radius:6px;overflow:hidden}.rbar div{height:100%}
.h2{color:var(--pri);font-weight:900;margin:30px 0 10px}.rwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px}.rwbox{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px}.rwbox h3{margin:0 0 6px}.rwbox table{font-size:13.5px}.rwbox td{white-space:normal;padding:6px 4px;vertical-align:top}.rwbox td:first-child{color:var(--mut);width:48%}
.spark{display:inline-flex;gap:2px;align-items:flex-end;height:22px;vertical-align:middle}.spark i{width:6px;background:#22B5A0;border-radius:2px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:12px}
.gcard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}.gcard>div:first-child{display:grid;gap:2px}
.gcode{font:900 26px ui-monospace,monospace;letter-spacing:.08em;color:var(--pri);background:#F4ECFA;border-radius:12px;padding:10px;text-align:center}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:2px dashed var(--line);border-radius:16px;padding:12px;margin-top:10px}.form input,.form select{width:auto;flex:1 1 150px}
select.mini{padding:4px 8px;font-size:12px;border-radius:9px;width:auto}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
const $ = s => document.querySelector(s), root = $('#root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const SRW = [[3, '🎁'], [7, '🏅'], [14, '🎧'], [30, '⭐'], [60, '👑'], [100, '🏆']];
const FEEL = { love: '😍', good: '🙂', meh: '😐', hard: '😟' }, CUR = ['Nivel 1 (1º prim.)', 'Nivel 2 (2º prim.)', 'Nivel 3 (3º prim.)', 'Nivel 4 (4º prim.)', 'Nivel 5 (5º prim.)', 'Nivel 6 (6º prim.)', 'Nivel 7 (1º ESO)', 'Nivel 8 (2º ESO)', 'Nivel 9 (3º ESO)', 'Nivel 10 (4º ESO)'];
let TRADES = [], BATS = [], CONTACTS = [], ROWS = [], SORT = ['streak', -1];
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const days = d => Math.round((new Date(todayStr() + 'T12:00') - new Date(d + 'T12:00')) / 864e5);
const ago = d => { if (!d) return '—'; const n = days(d); return n <= 0 ? 'hoy' : n === 1 ? 'ayer' : `hace ${n} días`; };
const alive = r => r.last_day && days(r.last_day) <= 1;
function weekId(d = new Date()) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())), day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y = t.getUTCFullYear(), w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7); return `${y}-W${String(w).padStart(2, '0')}`; }
// Qui entra: l'administrador (contrasenya) o un docent (correu + contrasenya → testimoni de 12 h)
let ME = null, ADMIN = false, GRUPS = [], CENTRES = [], DOCENTS = [];
const pass = () => sessionStorage.getItem('pp'), dtok = () => sessionStorage.getItem('dt');
const AUTH = () => pass() ? { 'x-profe': pass() } : dtok() ? { 'x-docent': dtok() } : null;
function login(err, mode) {
  mode = mode || (location.hash === '#admin' ? 'admin' : 'docent');
  root.innerHTML = `<div class="login"><img src="img/brand/logo-horitzontal.svg" alt="Numi Mates" style="height:44px;margin:0 auto 10px;display:block"><h1 style="font-size:22px">${mode === 'admin' ? 'Administración' : 'Panel del docente'}</h1>
    ${mode === 'admin' ? `<input id="pw" type="password" placeholder="Contraseña de administración" autocomplete="current-password">`
      : `<input id="em" type="email" placeholder="Correo electrónico" autocomplete="username" style="margin-bottom:10px"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password">`}
    <div class="err">${err || ''}</div><button onclick="doLogin('${mode}')">ENTRAR</button>
    <p class="note" style="text-align:center"><a href="#" onclick="event.preventDefault();login('', '${mode === 'admin' ? 'docent' : 'admin'}')">${mode === 'admin' ? 'Soy docente' : 'Administración'}</a></p></div>`;
  ($('#em') || $('#pw')).focus(); root.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(mode); }));
}
async function doLogin(mode) {
  sessionStorage.removeItem('pp'); sessionStorage.removeItem('dt');
  if (mode === 'admin') { sessionStorage.setItem('pp', $('#pw').value); return go(); }
  const r = await fetch('/api/docent', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'login', email: $('#em').value, password: $('#pw').value }) });
  const j = await r.json(); if (!j.token) return login('Correo o contraseña incorrectos.', 'docent');
  sessionStorage.setItem('dt', j.token); go();
}
function logout() { sessionStorage.removeItem('pp'); sessionStorage.removeItem('dt'); login(); }
async function go() {
  const h = AUTH(); if (!h) return login();
  const r = await fetch('/api/profe', { headers: h });
  if (r.status !== 200) { const m = pass() ? 'admin' : 'docent'; sessionStorage.removeItem('pp'); sessionStorage.removeItem('dt'); return login(m === 'admin' ? 'Contraseña incorrecta.' : 'La sesión ha caducado. Vuelve a entrar.', m); }
  const J = await r.json(); ADMIN = !!J.admin; ME = J.me || null; GRUPS = J.grups || []; CENTRES = J.centres || []; DOCENTS = J.docents || [];
  BATS = J.battles || []; TRADES = J.trades || []; CONTACTS = J.contacts || [];
  ROWS = (J.rows || []).map(r => ({ ...r, cards: Object.keys(r.album || {}).length, bwins: r.bwins || 0, ncrowns: (r.crowns || []).length, stier: r.season && r.season.id === seasonNow() ? Math.min(25, Math.floor(r.season.xp / 40)) : 0, evo: (r.tests || []).filter(t => t.kind === 'evo'), streakNow: alive(r) ? r.streak : 0, wxp: r.week && r.week.id === weekId() ? r.week.xp : 0 }));
  render();
}
async function act(action, code, extra = {}) {
  const r = await fetch('/api/profe', { method: 'POST', headers: { ...AUTH(), 'content-type': 'application/json' }, body: JSON.stringify({ action, code, ...extra }) });
  return r.json();
}
async function setPass(code, name) {
  const p = prompt(`Nueva contraseña para ${name} (mínimo 4 caracteres):`); if (!p) return;
  const r = await act('setpass', code, { password: p });
  alert(r.ok ? `Contraseña cambiada. Díselo a ${name}.` : r.error === 'contrasenya-format' ? 'Mínimo 4 caracteres.' : 'Este alumno aún no tiene usuario (entra con código).');
}
async function unlock(code, v) { await act('unlock', code, { value: v }); go(); }
const SENT = { num: ['🔢', 'Sentido numérico'], mes: ['📏', 'Sentido de la medida'], esp: ['📐', 'Sentido espacial'], alg: ['🧩', 'Sentido algebraico y pensamiento computacional'], est: ['🎲', 'Sentido estocástico'] };
function skillSent(sk) { const n = sk.split(':')[0]; if (/^(me\.clock|me\.units|me\.money|me\.perim|g\.clock|g\.coins|g\.ruler|geo\.area)$/.test(n)) return 'mes'; if (/^(me\.shape|g\.shape|geo\.angle|vol|e\.)/.test(n)) return 'esp'; if (/^(l\.|g\.seq|pc\.|g\.repeat)/.test(n)) return 'alg'; if (/^(stat|at\.)/.test(n)) return 'est'; return 'num'; }
function report(code) {
  const r = ROWS.find(x => x.code === code); if (!r) return;
  const agg = {}; Object.entries(r.sk || {}).forEach(([k, [c, t]]) => { if (k === 'sprint' || k === 'flash' || k === 'chain') return; const s = skillSent(k); agg[s] ||= [0, 0]; agg[s][0] += c; agg[s][1] += t; });
  const t = r.tests || [];
  const d = document.createElement('div'); d.className = 'ov'; d.onclick = e => { if (e.target === d) d.remove(); };
  d.innerHTML = `<div class="ovc"><h2>${esc(r.name)} · ${CUR[r.course] || ''}</h2><p class="mut">Informe por bloques del currículo (Decreto 175/2022). Útil para tutorías con las familias.</p>
    ${Object.keys(SENT).map(k => { const [c, tt] = agg[k] || [0, 0], pc = tt ? Math.round(100 * c / tt) : null; return `<div class="rrow"><span>${SENT[k][0]} ${SENT[k][1]}</span><div class="rbar"><div style="width:${pc || 0}%;background:${pc == null ? '#ddd' : pc >= 85 ? '#2A9C50' : pc >= 65 ? '#E8A400' : '#D63C42'}"></div></div><b>${pc == null ? '—' : pc + '% (' + tt + ' resp.)'}</b></div>`; }).join('')}
    <h3>Pruebas</h3><p>${t.length ? t.map(x => `${x.date.slice(8, 10)}/${x.date.slice(5, 7)}: <b>${x.pct}%</b> ${x.kind === 'inicial' ? '(inicial)' : ''}`).join(' · ') : 'Aún no ha hecho pruebas.'}</p>
    <h3>Pruebas de unidad (puerta del Caballero)</h3><p>${Object.keys(r.exams || {}).length ? Object.entries(r.exams).map(([k, x]) => `${CUR[+k.split('-')[0].slice(1) - 1]?.split(' (')[0] || k} · unidad ${k.split('-')[1]}: <b>${x.best}%</b> (último ${x.last}%, ${x.tries} intento${x.tries > 1 ? 's' : ''})`).join('<br>') : 'Aún no ha hecho ninguna.'}</p>
    ${r.school ? `<p>📚 Tema que dice estar dando en el cole: unidad ${r.school.ui + 1} de ${CUR[r.school.course] || ''}.</p>` : ''}
    ${r.reco ? `<p>⚔️ Tiene una misión recomendada pendiente (${r.reco.items.length} lecciones).</p>` : ''}
    <button onclick="this.closest('.ov').remove()">Cerrar</button></div>`;
  document.body.appendChild(d);
}
async function off(code, name) { if (!confirm(`¿Dar de baja a ${name}? Dejará de aparecer y no podrá entrar.`)) return; await act('off', code); go(); }
function evoCell(r) {
  const t = r.tests || []; if (!t.length) return '<span class="mut">—</span>';
  const last = t[t.length - 1], prev = t[t.length - 2], d = prev ? last.pct - prev.pct : null;
  return `<span class="spark">${t.slice(-6).map(x => `<i style="height:${Math.max(3, x.pct / 100 * 22)}px"></i>`).join('')}</span> <b>${last.pct}%</b> ${d == null ? '' : `<span class="${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'}${Math.abs(d)}</span>`}`;
}
function render() {
  const f = $('#fc')?.value || '', q = ($('#q')?.value || '').toLowerCase();
  const gf = $('#fg')?.value || ''; let rows = ROWS.filter(r => (!f || String(r.course) === f) && (!gf || String(r.grup_id || '') === gf) && (!q || (r.name + r.code + (r.username || '')).toLowerCase().includes(q)));
  const [k, dir] = SORT; rows.sort((a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * dir);
  const act_ = ROWS.filter(alive).length, prem = ROWS.reduce((n, r) => n + (r.srw || []).length, 0), ev = ROWS.filter(r => r.evo.length).length;
  const th = (key, label) => `<th onclick="SORT=['${key}',SORT[0]==='${key}'?-SORT[1]:-1];render()">${label}${SORT[0] === key ? (SORT[1] < 0 ? ' ↓' : ' ↑') : ''}</th>`;
  root.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>${ADMIN ? 'Administración · Numi Mates' : 'Panel del docente'}</h1><span>${ME ? `<span class="mut">${esc(ME.nom)} · ${esc(ME.centre || '')}</span> ` : ''}<button class="mini ghost" onclick="logout()">Salir</button></span></div><p class="lead">${ADMIN ? 'Todos los alumnos, centros, docentes y grupos.' : 'Los alumnos de tus grupos: progreso, rachas, pruebas e informes para las tutorías.'}</p>
  <div class="kpis"><div class="kpi"><b>${ROWS.length}</b><span>alumnos registrados</span></div><div class="kpi"><b class="fire">${act_}</b><span>con la racha encendida</span></div><div class="kpi"><b>${Math.max(0, ...ROWS.map(r => r.best))}</b><span>mejor racha (días)</span></div><div class="kpi"><b>${prem}</b><span>premios de racha ganados</span></div><div class="kpi"><b>${ev}</b><span>han hecho prueba de evolución</span></div></div>
  <div class="bar"><select id="fc" onchange="render()"><option value="">Todos los cursos</option>${CUR.map((n, i) => `<option value="${i}" ${f === String(i) ? 'selected' : ''}>${n}</option>`).join('')}</select>
  ${GRUPS.length ? `<select id="fg" onchange="render()"><option value="">Todos los grupos</option>${GRUPS.map(g => `<option value="${g.id}" ${gf === String(g.id) ? 'selected' : ''}>${esc(g.nom)}${ADMIN ? ' · ' + esc(g.centre) : ''}</option>`).join('')}</select>` : ''}<input id="q" placeholder="Buscar nombre, usuario o código" value="${esc(q)}" oninput="render()"><button class="ghost" onclick="csv()">Descargar CSV</button><button class="ghost" onclick="go()">Actualizar</button></div>
  <div class="tw"><table><thead><tr>${th('name', 'Alumno')}${th('username', 'Usuario')}${th('code', 'Código')}${th('course', 'Curso')}<th>Grupo</th>${ADMIN ? '<th>Plan</th>' : ''}${th('streakNow', 'Racha')}${th('best', 'Mejor')}<th>Premios racha</th>${th('xp', 'XP')}${th('lessons', 'Lecciones')}${th('cards', 'Cartas')}${th('bwins', 'Victorias')}${th('ncrowns', 'Coronas')}${th('stier', 'Temporada')}<th>Aciertos</th><th>Evolución</th>${th('last_day', 'Último día')}<th>Prueba inicial</th><th>Idioma</th><th></th></tr></thead><tbody>
  ${rows.map(r => `<tr class="${alive(r) ? '' : 'cold'}"><td><b>${esc(r.name)}</b></td><td>${r.username ? esc(r.username) : '<span class="mut">—</span>'}</td><td class="code">${esc(r.code)}</td><td>${CUR[r.course] || '—'}${r.survey && r.survey.age ? `<br><small class="mut">${r.survey.age} años</small>` : ''}</td><td>${r.grup_id ? esc((GRUPS.find(g => g.id === r.grup_id) || {}).nom || '—') : '<span class="mut">—</span>'}</td>${ADMIN ? `<td><select class="mini" onchange="setPla('${r.code}',this.value)">${['free', 'premium', 'escola'].map(p => `<option value="${p}" ${r.pla === p ? 'selected' : ''}>${({ free: 'Gratis', premium: 'Premium', escola: 'Escuela' })[p]}</option>`).join('')}</select></td>` : ''}
    <td class="fire">🔥 ${r.streakNow}</td><td>${r.best}</td><td class="rw">${SRW.map(([d, i]) => (r.srw || []).includes(d) ? i : '').join('') || '<span class="mut">—</span>'}</td>
    <td>${r.xp}</td><td>${r.lessons}</td><td>${r.cards}/56</td><td>${r.bwins ? '⚔️ ' + r.bwins : '<span class="mut">—</span>'}</td><td>${r.ncrowns ? '👑 ' + r.ncrowns : '<span class="mut">—</span>'}</td><td>${r.stier}/25</td><td>${r.answers ? Math.round(100 * r.correct / r.answers) + '%' : '—'}</td><td>${evoCell(r)}</td><td>${ago(r.last_day)}</td>
    <td>${r.survey ? `<span class="pill">${esc(r.survey.result || '')}</span> ${FEEL[r.survey.feel] || ''}` : '<span class="mut">—</span>'}</td><td>${r.lang === 'es' ? 'ES' : 'CAT'}</td>
    <td>${r.username ? `<button class="mini ghost" onclick="setPass('${r.code}','${esc(r.name)}')">Contraseña</button> ` : ''}<button class="mini ghost" onclick="report('${r.code}')">Informe</button> <button class="mini ghost" title="Abre todas las unidades a este alumno (modo maestro)" onclick="unlock('${r.code}',${!r.unlock_all})">${r.unlock_all ? '🔓 Todo abierto' : '🔒 Normal'}</button> ${r.grup_id ? `<button class="mini ghost" onclick="treure('${r.code}','${esc(r.name)}')">Quitar del grupo</button> ` : ''}${ADMIN ? `<button class="mini ghost red" onclick="off('${r.code}','${esc(r.name)}')">Baja</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="15" class="mut">Aún no hay alumnos.</td></tr>'}
  </tbody></table></div>
  <p class="note">Premios de racha: 🎁 3 días · 🏅 7 días · 🎧 14 días · ⭐ 30 días · 👑 60 días · 🏆 100 días. El botón 🔒/🔓 activa el «modo maestro» (todas las unidades abiertas) solo para ese alumno: el alumno ya no puede activarlo él mismo. Las filas en gris son alumnos que han perdido la racha (hace más de un día que no practican). La columna «Evolución» muestra las últimas pruebas (cada 14 días) y cuánto ha subido o bajado respecto a la anterior.</p>`;
  root.insertAdjacentHTML('beforeend', ADMIN ? gestioHTML() + contactsHTML() + battlesHTML() + tradesHTML() + rewardsHTML() : grupsHTML() + passHTML());
}
const seasonNow = () => { const d = new Date(), id = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; return id < '2026-10' ? '2026-10' : id; };
const secs = ms => (ms / 1000).toFixed(1).replace('.', ',') + ' s';
/* ---------- Grups, centres i docents ---------- */
const CURS = i => i == null ? '—' : (CUR[i] || '—').replace(/^Nivel \d+ \((.*)\)$/, '$1');
async function setPla(code, pla) { await act('pla', code, { pla }); go(); }
async function treure(code, name) { if (!confirm(`¿Quitar a ${name} del grupo? Volverá al plan gratuito.`)) return; await act('treure', code); go(); }
function grupCard(g) {
  return `<div class="gcard"><div><b>${esc(g.nom)}</b><span class="mut">${CURS(g.curs)}${ADMIN ? ' · ' + esc(g.centre) + (g.docent ? ' · ' + esc(g.docent) : '') : ''}</span><span class="mut">${ROWS.filter(r => r.grup_id === g.id).length} alumnos</span></div>
    <div class="gcode" title="Los alumnos lo escriben en la app: Perfil → Tengo un código de clase">${esc(g.codi)}</div>
    <div class="gact"><button class="mini ghost" onclick="copyCode('${g.codi}')">Copiar instrucciones</button> <button class="mini ghost" onclick="grupCodi(${g.id})">Código nuevo</button> <button class="mini ghost red" onclick="grupOff(${g.id},'${esc(g.nom)}')">Cerrar grupo</button></div></div>`;
}
function grupForm() {
  const centreSel = ADMIN ? `<select id="g_centre">${CENTRES.map(c => `<option value="${c.id}">${esc(c.nom)}</option>`).join('')}</select>` : '';
  const docSel = ADMIN || ME?.rol === 'admin_centre' ? `<select id="g_doc"><option value="">Sin docente</option>${DOCENTS.filter(d => ADMIN || d.centre_id === ME.centre_id).map(d => `<option value="${d.id}">${esc(d.nom)}</option>`).join('')}</select>` : '';
  return `<div class="form"><input id="g_nom" placeholder="Nombre del grupo (p. ej. 4t A)"><select id="g_curs"><option value="">Curso</option>${CUR.map((n, i) => `<option value="${i}">${n}</option>`).join('')}</select>${centreSel}${docSel}<button onclick="grupNew()">Crear grupo</button></div>`;
}
async function grupNew() {

function csv() {
  const head = ['Nombre', 'Usuario', 'Código', 'Curso', 'Racha', 'Mejor racha', 'Premios de racha', 'XP', 'Lecciones', '% aciertos', 'Última prueba evolución', 'Último día', 'Idioma'];
  const lines = ROWS.map(r => { const t = r.tests || []; return [r.name, r.username || '', r.code, CUR[r.course] || '', r.streakNow, r.best, (r.srw || []).join(' '), r.xp, r.lessons, r.answers ? Math.round(100 * r.correct / r.answers) : '', t.length ? t[t.length - 1].pct + '%' : '', r.last_day || '', r.lang === 'es' ? 'ES' : 'CAT'].map(v => `"${String(v).replace(/"/g, '""')}"`).join(';'); });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + [head.join(';'), ...lines].join('\n')], { type: 'text/csv' })); a.download = 'mates-numi-alumnos.csv'; a.click();
}
